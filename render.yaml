databases:
  - name: obraclick-db
    databaseName: obraclick_db
    user: obraclick_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: obraclick
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm run build:render
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: obraclick-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
