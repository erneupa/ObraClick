databases:
  - name: obraclick-db
    databaseName: obraclick_db
    user: obraclick_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: obraclick
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build:render
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: obraclick-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      # URL pública de la app (p. ej. https://certiobra.onrender.com o tu dominio propio).
      # Se usa para sitemap, SEO y enlaces de los emails. Render la pedirá al crear el Blueprint.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Opcionales: inicio de sesión con Google y emails (Resend)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Tu email de propietario: único que puede activarse PRO sin pasarela de pago
      - key: ADMIN_EMAIL
        sync: false
